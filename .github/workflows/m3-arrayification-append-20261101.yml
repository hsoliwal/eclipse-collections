# SPDX-License-Identifier: Apache-2.0
name: M3 Eclipse exact array-append differential
on:
  pull_request:
    paths:
      - 'eclipse-collections/src/main/java/com/m3/collections/eclipse/impl/list/fixed/ArrayAdapter.java'
      - 'unit-tests/src/test/java/com/m3/collections/eclipse/impl/list/fixed/M3ArrayAdapterAppendContractTest.java'
      - '.github/workflows/m3-arrayification-append-20261101.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  append-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Refuse source drift from canonical recipe
        shell: bash
        run: |
          set -euo pipefail
          printf '331efadf359c50448ee4fabd4c14f38b355c44c8bf8abaf3a7864cfa2bd57419  %s\n' 'eclipse-collections/src/main/java/com/m3/collections/eclipse/impl/list/fixed/ArrayAdapter.java' | sha256sum -c -
          printf 'a7186d80f6c60ba526e64b25135b70447d730040a381485f5121c4308c0ffc7d  %s\n' 'unit-tests/src/test/java/com/m3/collections/eclipse/impl/list/fixed/M3ArrayAdapterAppendContractTest.java' | sha256sum -c -
      - name: Execute real Eclipse array-append JUnit tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -pl eclipse-collections-api,eclipse-collections,eclipse-collections-testutils,unit-tests -am \
            -Dcheckstyle.skip=true \
            -Dtest=M3ArrayAdapterAppendContractTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Require executed non-skipped JUnit tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=list(Path('unit-tests/target/surefire-reports').glob('TEST-*M3ArrayAdapterAppendContractTest*.xml'))
          assert reports, 'NO_REAL_JUNIT_REPORTS'
          totals=[0,0,0,0]
          for f in reports:
              e=ET.parse(f).getroot()
              totals=[a+int(e.attrib.get(k,'0')) for a,k in zip(totals,('tests','failures','errors','skipped'))]
          assert totals[0]>=2 and totals[1:]==[0,0,0],totals
          print('ECLIPSE_APPEND_CONTRACT_PASS',totals)
          PY
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-eclipse-array-append
          if-no-files-found: warn
          path: unit-tests/target/surefire-reports/
