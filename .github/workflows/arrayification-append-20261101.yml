# SPDX-License-Identifier: Apache-2.0
name: Eclipse exact array-append differential
on:
  pull_request:
    paths:
      - 'eclipse-collections/src/main/java/org/eclipse/collections/impl/list/fixed/ArrayAdapter.java'
      - 'unit-tests/src/test/java/org/eclipse/collections/impl/list/fixed/ArrayAdapterAppendContractTest.java'
      - 'unit-tests/src/test/java/org/eclipse/collections/impl/list/fixed/ArrayAdapterFactoryContractTest.java'
      - '.github/workflows/arrayification-append-20261101.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  append-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Refuse source drift from canonical recipe
        shell: bash
        run: |
          set -euo pipefail
          # Historical source receipt (2026-11-01): ba5a3c86c385e90db5d499d619408a6c494c05d125de5b3d8f7e6e57021cc34b
          # Additive exact FastList one-array successor (2026-11-13): 5ca554c625b25c12f9d780f116497d84261c828efdc8d033d0bf6bfd33f064ec
          printf 'da2128d3fe890de1f667fa2007a57efc181915c51d259f4d06835e739fe3cfab  %s\n' 'eclipse-collections/src/main/java/org/eclipse/collections/impl/list/fixed/ArrayAdapter.java' | sha256sum -c -
          printf 'a1a5383e49f1cf97e6f6b0156fee6e751f90d8799d74f46d693f29b23221d575  %s\n' 'unit-tests/src/test/java/org/eclipse/collections/impl/list/fixed/ArrayAdapterAppendContractTest.java' | sha256sum -c -
          printf '65b0b59a4adabf581a8fc7415cdfae11b2cf1c70cc0f78f933bd7ac43a26d649  %s\n' 'unit-tests/src/test/java/org/eclipse/collections/impl/list/fixed/ArrayAdapterFactoryContractTest.java' | sha256sum -c -
      - name: Execute real Eclipse array-append JUnit tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -pl eclipse-collections-api,eclipse-collections,eclipse-collections-testutils,unit-tests -am \
            -Dcheckstyle.skip=true \
            -Dtest=ArrayAdapterAppendContractTest,ArrayAdapterFactoryContractTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Require executed non-skipped JUnit tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=list(Path('unit-tests/target/surefire-reports').glob('TEST-*ArrayAdapter*ContractTest*.xml'))
          assert reports, 'NO_REAL_JUNIT_REPORTS'
          totals=[0,0,0,0]
          for f in reports:
              e=ET.parse(f).getroot()
              totals=[a+int(e.attrib.get(k,'0')) for a,k in zip(totals,('tests','failures','errors','skipped'))]
          assert totals[0]>=4 and totals[1:]==[0,0,0],totals
          print('ECLIPSE_APPEND_CONTRACT_PASS',totals)
          PY
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-array-append
          if-no-files-found: warn
          path: unit-tests/target/surefire-reports/
